services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: thup-app
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DATAGSM_CLIENT_ID=${DATAGSM_CLIENT_ID}
      - DATAGSM_CLIENT_SECRET=${DATAGSM_CLIENT_SECRET}
      - DATAGSM_REDIRECT_URI=${DATAGSM_REDIRECT_URI}
      - OAUTH_SUCCESS_REDIRECT_URL=${OAUTH_SUCCESS_REDIRECT_URL}
      - OAUTH_FAILURE_REDIRECT_URL=${OAUTH_FAILURE_REDIRECT_URL}
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_SAME_SITE=None
      - STORAGE_BASE_DIR=/data/storage
    ports:
      - "80:8080"
    volumes:
      - storage_data:/data/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - gsmsv-net

  # mysql:8.0.46 (2026-07 기준). 예고 없는 패치 버전 교체를 막기 위해 다이제스트로 고정.
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: thup-mysql
    environment:
      - MYSQL_DATABASE=thup
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - TZ=Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # --password= 인자 대신 MYSQL_PWD 환경변수를 사용해 ps 목록에 비밀번호가 노출되지 않도록 함
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - gsmsv-net

  # redis:7.4.10-alpine (2026-07 기준). 예고 없는 패치 버전 교체를 막기 위해 다이제스트로 고정.
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: thup-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - gsmsv-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  gsmsv-net:
    driver: bridge
    driver_opts:
      # GSMSV VM은 GRE 터널을 통해 공인 IP를 받아 실사용 가능 MTU가 1400으로 고정되어 있음.
      # 기본 Docker 네트워크 MTU(1500)로 두면 외부 HTTP 요청이 응답 없이 실패한다.
      com.docker.network.driver.mtu: "1400"
