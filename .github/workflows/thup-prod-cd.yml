name: Prod CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build JAR
        run: ./gradlew bootJar -x test --no-daemon

      - name: Copy deploy files to chup-prod VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ssh.gsmsv.site
          port: 24152
          username: ubuntu
          password: ${{ secrets.PROD_GSMSV_SSH_PASSWORD }}
          source: "build/libs/thup-*.jar,docker/Dockerfile,deploy/compose.prod.yml,deploy/Caddyfile.prod"
          target: "/home/ubuntu/thup/"

      - name: Deploy on chup-prod VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ssh.gsmsv.site
          port: 24152
          username: ubuntu
          password: ${{ secrets.PROD_GSMSV_SSH_PASSWORD }}
          envs: MYSQL_PASSWORD,REDIS_PASSWORD,DATAGSM_CLIENT_ID,DATAGSM_CLIENT_SECRET,RESEND_API_KEY,MAIL_FROM_ADDRESS,DISCORD_JOB_WEBHOOK_URL,DISCORD_ERROR_WEBHOOK_URL
          script: |
            set -e
            cd /home/ubuntu/thup/deploy
            mv -f compose.prod.yml compose.yml
            mv -f Caddyfile.prod Caddyfile

            cat > .env << ENVEOF
            MYSQL_PASSWORD=$MYSQL_PASSWORD
            REDIS_PASSWORD=$REDIS_PASSWORD
            DATAGSM_CLIENT_ID=$DATAGSM_CLIENT_ID
            DATAGSM_CLIENT_SECRET=$DATAGSM_CLIENT_SECRET
            RESEND_API_KEY=$RESEND_API_KEY
            MAIL_FROM_ADDRESS=$MAIL_FROM_ADDRESS
            DISCORD_JOB_WEBHOOK_URL=$DISCORD_JOB_WEBHOOK_URL
            DISCORD_ERROR_WEBHOOK_URL=$DISCORD_ERROR_WEBHOOK_URL
            ENVEOF

            docker compose --env-file .env up -d --build

            # Caddyfile을 mv로 교체하면 inode가 바뀐다. caddy 컨테이너의 파일 바인드 마운트는
            # 컨테이너 시작 시점의 inode에 고정되므로, compose up만으로는(서비스 정의 자체는 안
            # 바뀌어 재생성되지 않음) 새 내용이 반영되지 않고, `caddy reload`조차 컨테이너가 보는
            # 옛 마운트를 다시 읽을 뿐이라 효과가 없다. 마운트를 새로 맺으려면 컨테이너를 실제로
            # 재시작해야 한다.
            docker compose restart caddy

            docker image prune -f
        env:
          MYSQL_PASSWORD: ${{ secrets.PROD_MYSQL_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          DATAGSM_CLIENT_ID: ${{ secrets.PROD_DATAGSM_CLIENT_ID }}
          DATAGSM_CLIENT_SECRET: ${{ secrets.PROD_DATAGSM_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
          MAIL_FROM_ADDRESS: ${{ secrets.PROD_MAIL_FROM_ADDRESS }}
          DISCORD_JOB_WEBHOOK_URL: ${{ secrets.PROD_DISCORD_JOB_WEBHOOK_URL }}
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.PROD_DISCORD_ERROR_WEBHOOK_URL }}
