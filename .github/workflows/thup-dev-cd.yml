name: Dev CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build JAR
        run: ./gradlew bootJar -x test --no-daemon

      - name: Copy deploy files to GSM SV VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ssh.gsmsv.site
          port: ${{ secrets.GSMSV_SSH_PORT }}
          username: ubuntu
          key: ${{ secrets.GSMSV_SSH_PRIVATE_KEY }}
          source: "build/libs/thup-*.jar,docker/Dockerfile,deploy/compose.yml,deploy/Caddyfile"
          target: "/home/ubuntu/thup/"

      - name: Deploy on GSM SV VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ssh.gsmsv.site
          port: ${{ secrets.GSMSV_SSH_PORT }}
          username: ubuntu
          key: ${{ secrets.GSMSV_SSH_PRIVATE_KEY }}
          envs: MYSQL_PASSWORD,REDIS_PASSWORD,DATAGSM_CLIENT_ID,DATAGSM_CLIENT_SECRET,DATAGSM_REDIRECT_URI,OAUTH_ALLOWED_REDIRECT_ORIGINS,OAUTH_DEFAULT_REDIRECT_ORIGIN,OAUTH_SUCCESS_REDIRECT_PATH,OAUTH_FAILURE_REDIRECT_PATH,RESEND_API_KEY,MAIL_FROM_ADDRESS
          script: |
            set -e
            cd /home/ubuntu/thup/deploy

            cat > .env << ENVEOF
            MYSQL_PASSWORD=$MYSQL_PASSWORD
            REDIS_PASSWORD=$REDIS_PASSWORD
            DATAGSM_CLIENT_ID=$DATAGSM_CLIENT_ID
            DATAGSM_CLIENT_SECRET=$DATAGSM_CLIENT_SECRET
            DATAGSM_REDIRECT_URI=$DATAGSM_REDIRECT_URI
            OAUTH_ALLOWED_REDIRECT_ORIGINS=$OAUTH_ALLOWED_REDIRECT_ORIGINS
            OAUTH_DEFAULT_REDIRECT_ORIGIN=$OAUTH_DEFAULT_REDIRECT_ORIGIN
            OAUTH_SUCCESS_REDIRECT_PATH=$OAUTH_SUCCESS_REDIRECT_PATH
            OAUTH_FAILURE_REDIRECT_PATH=$OAUTH_FAILURE_REDIRECT_PATH
            RESEND_API_KEY=$RESEND_API_KEY
            MAIL_FROM_ADDRESS=$MAIL_FROM_ADDRESS
            ENVEOF

            docker compose --env-file .env up -d --build
            docker image prune -f
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DATAGSM_CLIENT_ID: ${{ secrets.DATAGSM_CLIENT_ID }}
          DATAGSM_CLIENT_SECRET: ${{ secrets.DATAGSM_CLIENT_SECRET }}
          DATAGSM_REDIRECT_URI: ${{ secrets.DATAGSM_REDIRECT_URI }}
          OAUTH_ALLOWED_REDIRECT_ORIGINS: ${{ secrets.OAUTH_ALLOWED_REDIRECT_ORIGINS }}
          OAUTH_DEFAULT_REDIRECT_ORIGIN: ${{ secrets.OAUTH_DEFAULT_REDIRECT_ORIGIN }}
          OAUTH_SUCCESS_REDIRECT_PATH: ${{ secrets.OAUTH_SUCCESS_REDIRECT_PATH }}
          OAUTH_FAILURE_REDIRECT_PATH: ${{ secrets.OAUTH_FAILURE_REDIRECT_PATH }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}