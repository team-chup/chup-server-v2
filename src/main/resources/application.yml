spring:
  application:
    name: thup

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/thup?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1

  session:
    redis:
      flush-mode: immediate
      save-mode: on-set-attribute

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

server:
  port: 8080
  servlet:
    session:
      timeout: 3h
  forward-headers-strategy: framework

storage:
  base-dir: ${STORAGE_BASE_DIR:./storage}

mail:
  api-key: ${RESEND_API_KEY:}
  from-address: ${MAIL_FROM_ADDRESS:onboarding@resend.dev}

session:
  cookie:
    # 로컬(http://localhost)은 Secure 쿠키를 거부하므로 기본값은 완화된 설정입니다.
    # 운영 배포 시 반드시 SESSION_COOKIE_SECURE=true, SESSION_COOKIE_SAME_SITE=None 으로 설정하세요.
    secure: ${SESSION_COOKIE_SECURE:false}
    same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

oauth:
  datagsm:
    client-id: ${DATAGSM_CLIENT_ID}
    client-secret: ${DATAGSM_CLIENT_SECRET}
    redirect-uri: ${DATAGSM_REDIRECT_URI:http://localhost:8080/api/auth/datagsm/callback}
    success-redirect-url: ${OAUTH_SUCCESS_REDIRECT_URL:http://localhost:3000}
    failure-redirect-url: ${OAUTH_FAILURE_REDIRECT_URL:http://localhost:3000/login/error}

cors:
  allowed-origins:
    - "http://localhost:3000"

sdk:
  logging:
    enabled: true
    not-logging-urls:
      - "/v3/api-docs/**"
      - "/swagger-ui/**"
      - "/api/auth/datagsm/callback"

  response:
    enabled: true
    not-wrapping-urls:
      - "/v3/api-docs/**"
      - "/v3/api-docs"
      - "/swagger-ui/**"
      - "/api/auth/datagsm/login"
      - "/api/auth/datagsm/callback"

  exception:
    enabled: true
    use-english-message: true

  swagger:
    enabled: true
    title: "Thup API"
    description: "Thup API Documentation"
    version: "v1"
    group: "API"
    paths-to-match:
      - "/api/**"