services:
  mysql:
    image: mysql:8.0
    container_name: thup-mysql
    environment:
      MYSQL_DATABASE: thup
      MYSQL_ROOT_PASSWORD: 1234
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - thup-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=1234"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: thup-redis
    ports:
      - "6379:6379"
    volumes:
      - thup-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  thup-mysql-data:
    driver: local
  thup-redis-data:
    driver: local